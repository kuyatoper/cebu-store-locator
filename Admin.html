<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Cebu Store Locator</title>
  <link rel="stylesheet" href="Website.css">
</head>
<body>
  <header>
    <h1>Admin Panel</h1>
    <p>Add and manage stores and items</p>
  </header>

  <nav class="navbar">
    <ul>
      <li><a href="Home.html">🏠 Home</a></li>
      <li><a href="Index.html">🔍 Search</a></li>
      <li><a href="Admin.html">⚙️ Admin Panel</a></li>
    </ul>
  </nav>

  <main>
    <section class="form-section">
      <h2>Add Store</h2>
      <form id="storeForm">
        <input type="text" id="storeName" placeholder="Store Name" required>
        <input type="text" id="storeAddress" placeholder="Address" required>
        <input type="url" id="storeMaps" placeholder="Google Maps Link">
        <input type="url" id="storeWebsite" placeholder="Website Link">
        <button type="submit">Add Store</button>
      </form>
    </section>

    <section class="form-section">
      <h2>Add Item</h2>
      <form id="itemForm">
        <input type="text" id="itemName" placeholder="Item Name" required>
        <input type="text" id="itemDesc" placeholder="Description">
        <input type="number" id="itemStock" placeholder="Stock Quantity" min="0" required>
        <input type="number" id="itemStoreId" placeholder="Store ID" min="1" required>
        <button type="submit">Add Item</button>
      </form>
      <p id="itemHint">Add a store first, then use its Store ID when adding an item.</p>
    </section>

    <section class="form-section table-section">
      <h2>Current Items</h2>
      <button type="button" id="refreshItems">🔄 Refresh Items</button>
      <div class="table-wrapper">
        <table id="itemTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Item Name</th>
              <th>Description</th>
              <th>Stock</th>
              <th>Store</th>
              <th>Address</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Cebu Store Locator Project</p>
  </footer>

  <script src="Admin.js"></script>
</body>
</html>
